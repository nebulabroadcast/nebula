[project]
name = "nebula"
version = "6.1.3"
description = "Open source broadcast automation system"
authors = [
  {name = "Nebula Broadcast", email = "info@nebulabroadcast.com"},
]

requires-python = ">=3.13"
dependencies = [
    "aiocache>=0.12.3",
    "aiofiles >=25.1.0",
    "anyio>=4.13.0",
    "asyncpg >=0.31.0",
    "authlib>=1.6.6",
    "email-validator >=2.3.0",
    "fastapi >=0.128.0",
    "geoip2 >=5.2.0",
    "gunicorn >=23.0.0",
    "httpx >=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "mistune >=3.2.0",
    "pydantic >=2.12.5",
    "python-dotenv >=1.2.1",
    "redis >=7.1.0",
    "requests >=2.32.5",
    "rich >=14.2.0",
    "shortuuid >=1.0.13",
    "unidecode>=1.4.0",
    "user-agents >=2.2.0",
    "uvicorn-worker>=0.4.0",
    "uvicorn[standard] >=0.40.0",
]

[dependency-groups]
dev = [
    "asyncpg-stubs >=0.31.1",
    "mypy >=1.19",
    "pytest >=9.0",
    "pytest-asyncio >=1.3.0",
    "ruff >=0.14.13",
    "types-aiofiles >=25.1.0.20251011",
    "types-authlib>=1.6.6.20260116",
    "types-requests >=2.32.4.20260107",
]

#
# Tools
#

[tool.ruff]
fix = true
line-length = 88

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["ALL"]

ignore = [
  "BLE",     # FIXME: blind exceptions. I don't like them either, but they are useful in some cases
  "COM812",  # OK: messes with formatter
  "D",       # FIXME: docstrings. Naaah.
  "EM",      # OK: String literals in exception messages (why not?)
  "FBT",     # Boolean positional argument (WTF?)
  "FIX002",  # FIXME: TODOs
  "ISC001",  # OK: Incompatible with formatting
  "PLR2004", # OK: Magic numbers (just a few)
  "PTH",     # FIXME: path-like objects
  "S101",    # OK: I like asserts. They make mypy happy
  "S104",    # OK: bind to all interfaces (We need this)
  "S110",    # OK: except: pass 
  "S608",    # FIXME: sql injections. let's wait for template strings
  "SIM105",  # OK: contextlib.suppress is ugly
  "TD002",   # Author name in TODOs
  "TD003",   # Issue link in TODOs
  "TRY003",  # OK: Avoid specicying long messages outside of exceptions
  "ANN",     # FIXME: Any
  "ERA",     # Commented out code
  "RUF012",  # FIXME ClassVar
]

[tool.mypy]
plugins = ["pydantic.mypy"]

strict = true
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true
exclude = "tests/|.venv/"

[pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["user_agents", "aiocache"]
ignore_errors = true
follow_imports = "skip"
ignore_missing_imports = true
