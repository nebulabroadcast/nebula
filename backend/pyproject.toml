[project]
name = "nebulabroadcast-core"
version = "6.1.6"
description = "Async domain library of the Nebula broadcast automation system"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
  {name = "Nebula Broadcast", email = "info@nebulabroadcast.com"},
]
classifiers = [
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

requires-python = ">=3.14"
# Only what the `nebula` package imports; the server's deps are in the
# "server" group (groups aren't published)
dependencies = [
    "aiofiles >=25.1.0",
    "asyncpg >=0.31.0",
    "httpx2>=2.16.0",
    "jinja2>=3.1.6",
    "mistune >=3.2.0",
    "nx-framework[postgres,redis]>=0.0.9",
    "pydantic >=2.12.5",
    "python-dotenv >=1.2.1",
    "unidecode>=1.4.0",
]

[project.urls]
Homepage = "https://nebulabroadcast.com"
Documentation = "https://docs.nebulabroadcast.com"
Source = "https://github.com/nebulabroadcast/nebula"

[build-system]
requires = ["uv_build>=0.9.8,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nebula"
module-root = ""

[tool.uv]
default-groups = ["dev", "server"]

[dependency-groups]
server = [
    "aiocache>=0.12.3",
    "anyio>=4.13.0",
    "authlib>=1.6.6",
    "email-validator >=2.3.0",
    "fastapi >=0.128.0",
    "geoip2 >=5.2.0",
    "gunicorn >=23.0.0",
    "itsdangerous>=2.2.0",
    "redis >=7.1.0",
    "requests >=2.32.5",
    "rich >=14.2.0",
    "shortuuid >=1.0.13",
    "user-agents >=2.2.0",
    "uvicorn-worker>=0.4.0",
    "uvicorn[standard] >=0.40.0",
]
dev = [
    "asyncpg-stubs >=0.31.1",
    "mypy >=1.19",
    "pytest >=9.0",
    "pytest-asyncio >=1.3.0",
    "ruff >=0.14.13",
    "types-aiofiles >=25.1.0.20251011",
    "types-authlib>=1.6.6.20260116",
    "types-requests >=2.32.4.20260107",
]

#
# Tools
#

[tool.ruff]
fix = true
line-length = 88

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["ALL"]

ignore = [
  "BLE",     # blind exceptions. I don't like them either, but they are useful in some cases
  "COM812",  # OK: messes with formatter
  "D",       # docstrings. Naaah.
  "EM",      # OK: String literals in exception messages (why not?)
  "FBT",     # Boolean positional argument (WTF?)
  "FIX002",  # TODOs
  "ISC001",  # OK: Incompatible with formatting
  "PLR2004", # OK: Magic numbers (just a few)
  "PTH",     # path-like objects
  "S101",    # OK: I like asserts. They make mypy happy
  "S104",    # OK: bind to all interfaces (We need this)
  "S110",    # OK: except: pass 
  "SIM105",  # OK: contextlib.suppress is ugly
  "TD002",   # Author name in TODOs
  "TD003",   # Issue link in TODOs
  "TRY003",  # OK: Avoid specicying long messages outside of exceptions
  "ANN",     # Any
  "ERA",     # Commented out code
  "RUF012",  # ClassVar
  "CPY001",  # Copyright header
  "PLR0917", # Too many positional arguments in function call
  "TC001",   # Imports used only in annotations: pydantic and FastAPI read
  "TC002",   # annotations at runtime, so they can't move under
  "TC003",   # TYPE_CHECKING even with deferred annotations (3.14)
]

[tool.ruff.lint.per-file-ignores]
# SQL built with f-strings, written before t-strings. New SQL uses
# t-strings (nebula/sql.py); remove a file here once it's converted.
"api/browse_assets/_query.py" = ["S608"]
"api/jobs/send_to.py" = ["S608"]
"api/objects/get_objects.py" = ["S608"]
"nebula/objects/base.py" = ["S608"]
"setup/settings.py" = ["S608"]

[tool.mypy]
plugins = ["pydantic.mypy"]

strict = true
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true
exclude = "tests/|.venv/"

[pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["user_agents", "aiocache"]
ignore_errors = true
follow_imports = "skip"
ignore_missing_imports = true
